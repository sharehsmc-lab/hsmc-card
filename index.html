<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSMC 명함 만들기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F2F4F6;color:#191F28;font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #3182F6;outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fill{from{width:0}to{width:100%}}
@keyframes spin{to{transform:rotate(360deg)}}
.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 16px}
.panel{position:relative;width:400px;max-width:100%;height:760px;max-height:calc(100vh - 48px);background:#fff;border-radius:24px;box-shadow:0 8px 32px rgba(25,31,40,.12);overflow:hidden;display:flex;flex-direction:column}
.main{flex:1;min-height:0;overflow-y:auto;padding:36px 24px 16px;display:flex;flex-direction:column;gap:24px}
.foot{display:flex;gap:12px;padding:12px 24px 24px}
.foot>div{flex:1 1 0;min-width:0}
h1{margin:0;font-size:24px;line-height:1.4;font-weight:700;text-wrap:pretty}
.stack{display:flex;flex-direction:column;gap:12px}
.stack20{display:flex;flex-direction:column;gap:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:0 12px;border:0;border-radius:14px;font-size:16px;font-weight:700;line-height:1.3;transition:background .12s,transform .12s,opacity .12s}
.btn-primary{background:#3182F6;color:#fff}
.btn-primary:hover:not(:disabled){background:#2E7AE7}
.btn-primary:active:not(:disabled),.btn-primary.is-loading{background:#2B72D8}
.btn-primary:active:not(:disabled){transform:scale(.98)}
.btn-secondary{background:#E5E8EB;color:#333D4B}
.btn-secondary:hover:not(:disabled){background:#D7DADD}
.btn-secondary:active:not(:disabled){background:#CACCCF;transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary.is-loading:disabled{opacity:1;cursor:progress}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.field{display:flex;align-items:center;gap:8px;width:100%;height:56px;padding:0 16px;border:1.5px solid #E5E8EB;border-radius:12px;background:#fff;transition:border-color .12s}
.field:focus-within{border-color:#3182F6}
.field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:17px;color:#191F28}
.field input::placeholder{color:#6B7684}
.field input:disabled{color:#4E5968;-webkit-text-fill-color:#4E5968}
.field.locked{background:#E5E8EB;border-color:#E5E8EB}
.field .suffix{font-size:17px;color:#4E5968;white-space:nowrap}
button.field{justify-content:space-between;text-align:left;font-size:17px;color:#191F28}
.lbl{display:block;margin-bottom:8px;font-size:14px;font-weight:500;color:#4E5968}
.choice{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:64px;padding:12px 20px;border:1.5px solid #E5E8EB;border-radius:14px;background:#fff;font-size:17px;font-weight:500;color:#191F28;text-align:left;transition:background .12s,border-color .12s,transform .12s}
.choice:hover{background:#F9FAFB}
.choice:active{transform:scale(.99)}
.choice.sel{border-color:#3182F6;background:#EAF2FE}
.seg{flex:1;height:40px;border:0;border-radius:10px;background:transparent;font-size:15px;font-weight:500;color:#4E5968}
.seg.sel{background:#fff;color:#191F28;font-weight:700;box-shadow:0 1px 3px rgba(25,31,40,.12)}
.linkbtn{padding:4px 0;border:0;background:transparent;font-size:15px;font-weight:500;color:#1B64DA;text-decoration:underline;text-underline-offset:3px;text-align:left}
.hint{font-size:13px;color:#6B7684}
.preview{font-size:14px;font-weight:500;color:#1B64DA}
.err{font-size:14px;color:#B42318}
.alert{padding:12px 14px;border-radius:10px;background:#FDECEA;color:#B42318;font-size:14px;font-weight:500}
.sub{font-size:14px;font-weight:400;color:#4E5968}
.intro{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 32px}
.sheet{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:flex-end}
.sheet .scrim{position:absolute;inset:0;border:0;background:rgba(25,31,40,.5);cursor:default}
.sheet .body{position:relative;display:flex;flex-direction:column;gap:10px;padding:24px;background:#fff;border-radius:24px 24px 0 0}
.cardbox{position:relative;width:352px;max-width:100%;height:196px;overflow:hidden;border-radius:8px;background:#fff;box-shadow:0 0 0 1px #E5E8EB,0 4px 16px rgba(25,31,40,.08);cursor:zoom-in}
.card{position:absolute;left:0;top:0;width:450px;height:250px;overflow:hidden;transform-origin:0 0;transition:transform .08s linear}
.card .t{position:absolute;white-space:nowrap;line-height:1}
.caption{font-size:13px;color:#4E5968}
</style>

<script>
/* ===== 명함 PDF 생성기 (card-pdf.js) ===== */
/*
 * HSMC 명함 PDF 생성기
 * card-layout.json(설계도) + 직원 정보 → 앞·뒷면 2페이지 CMYK PDF
 * 브라우저(신청 화면)와 Node 양쪽에서 같은 코드로 동작합니다.
 *
 * buildCardPdf({ PDFLib, fontkit, layout, fontBytes, person }) → Uint8Array
 *   person = { koLast, koFirst, koTitle, org, enName, enTitle1, enTitle2,
 *              mobile, email1, email2, design: 'white' | 'black' }
 */
(function (root) {
  const MM = 72 / 25.4;

  function cardTexts(p) {
    const koTitle = p.koTitle === '사원' ? '' : (p.koTitle || '');
    const prefix = (p.org === '1본부' || p.org === '2본부') ? p.org : '';
    const t1 = prefix && p.enTitle1 ? prefix + ' | ' + p.enTitle1 : (p.enTitle1 || prefix);
    const m = String(p.mobile || '').replace(/\D/g, '');
    const mobile = m.length === 11 ? '+82 ' + m.slice(1, 3) + ' ' + m.slice(3, 7) + ' ' + m.slice(7) : '';
    return {
      nameEn: p.enName || '',
      nameKo: (p.koLast || '') + (p.koFirst || '') + (koTitle ? ' ' + koTitle : ''),
      title1: t1,
      title2: p.enTitle2 || '',
      email1: p.email1 ? p.email1 + '@hivesmc.com' : '',
      email2: p.email2 ? p.email2 + '@oksmc.co.kr' : '',
      mobile: mobile
    };
  }

  function pickVariant(layout, p) {
    if (p.design === 'white') return { key: 'white', spec: layout.front.white };
    const base = layout.front.black;
    if (!p.enTitle2) return { key: 'black', spec: base };
    const v = base.variants.twoLineTitle;
    const text = {};
    Object.keys(base.text).forEach((k) => { text[k] = Object.assign({}, base.text[k], v.text[k] || {}); });
    const rules = base.rules.map((r) => Object.assign({}, r, (v.rules || {})[r.id] || {}));
    return { key: 'black+twoLineTitle', spec: Object.assign({}, base, { text, rules }) };
  }

  async function buildCardPdf({ PDFLib, fontkit, layout, fontBytes, person }) {
    const { PDFDocument, cmyk } = PDFLib;
    const pg = layout.page;
    const markMargin = pg.cropMarks.enabled ? pg.cropMarks.offset + pg.cropMarks.length : pg.bleed;
    const origin = markMargin; // 문서 왼쪽 위 → 재단선 왼쪽 위까지 거리(mm)
    const W = (pg.trim.w + 2 * markMargin) * MM;
    const H = (pg.trim.h + 2 * markMargin) * MM;

    const col = (name) => { const c = layout.colors[name].cmyk; return cmyk(c[0] / 100, c[1] / 100, c[2] / 100, c[3] / 100); };
    const X = (mm) => (origin + mm) * MM;
    const Y = (mm) => H - (origin + mm) * MM;

    const doc = await PDFDocument.create();
    doc.setTitle('HSMC 명함');
    // 글꼴은 PDF에 넣지 않고, 글자 모양을 도형(윤곽선)으로 그린다 → 인쇄소 글꼴 오류 없음
    const fonts = {};
    for (const k of Object.keys(fontBytes)) fonts[k] = fontkit.create(fontBytes[k] instanceof Uint8Array ? fontBytes[k] : new Uint8Array(fontBytes[k]));
    function outline(s, spec) {
      const f = fonts[spec.font], upm = f.unitsPerEm;
      const track = (spec.tracking || 0) / 1000 * upm;
      let pen = 0, d = '';
      for (const g of f.layout(s).glyphs) {
        const sv = g.path.scale(1, -1).translate(pen, 0).toSVG();
        if (sv) d += sv + ' ';
        pen += g.advanceWidth + track;
      }
      return { d: d.trim(), width: pen * spec.size / upm, scale: spec.size / upm };
    }

    function newPage() {
      const page = doc.addPage([W, H]);
      const b = pg.bleed;
      page.setBleedBox(X(-b), Y(pg.trim.h + b), (pg.trim.w + 2 * b) * MM, (pg.trim.h + 2 * b) * MM);
      page.setTrimBox(X(0), Y(pg.trim.h), pg.trim.w * MM, pg.trim.h * MM);
      return page;
    }

    function text(page, s, spec, color) {
      if (!s) return;
      const o = outline(s, spec);
      if (o.d) page.drawSvgPath(o.d, { x: X(spec.x), y: Y(spec.y), scale: o.scale, color, borderWidth: 0 });
    }
    function advance(s, spec) { return s ? outline(s, spec).width : 0; }
    function logo(page, spec) {
      const scale = (spec.width * MM) / layout.logo.width;
      for (const part of ['h', 'smc']) {
        page.drawSvgPath(layout.logo.parts[part], { x: X(spec.x), y: Y(spec.top), scale, color: col(spec.colors[part]), borderWidth: 0 });
      }
    }
    function rule(page, r) {
      const b = pg.bleed;
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      page.drawLine({
        start: { x: X(clamp(r.x1, -b, pg.trim.w + b)), y: Y(clamp(r.y1, -b, pg.trim.h + b)) },
        end: { x: X(clamp(r.x2, -b, pg.trim.w + b)), y: Y(clamp(r.y2, -b, pg.trim.h + b)) },
        thickness: r.strokePt, color: col(r.color)
      });
    }
    function cropMarks(page) {
      const c = pg.cropMarks; if (!c.enabled) return;
      const color = col(c.color); const t = c.strokePt;
      const xs = [0, pg.trim.w], ys = [0, pg.trim.h];
      for (const x of xs) for (const y of ys) {
        const dx = x === 0 ? -1 : 1, dy = y === 0 ? -1 : 1;
        page.drawLine({ start: { x: X(x + dx * c.offset), y: Y(y) }, end: { x: X(x + dx * (c.offset + c.length)), y: Y(y) }, thickness: t, color });
        page.drawLine({ start: { x: X(x), y: Y(y + dy * c.offset) }, end: { x: X(x), y: Y(y + dy * (c.offset + c.length)) }, thickness: t, color });
      }
    }

    // ── 앞면
    const v = pickVariant(layout, person);
    const spec = v.spec;
    const t = cardTexts(person);
    const front = newPage();
    if (spec.background) {
      const b = pg.bleed;
      front.drawRectangle({ x: X(-b), y: Y(pg.trim.h + b), width: (pg.trim.w + 2 * b) * MM, height: (pg.trim.h + 2 * b) * MM, color: col(spec.background), borderWidth: 0 });
    }
    spec.rules.forEach((r) => rule(front, r));
    logo(front, spec.logo);
    const tc = col(spec.textColor);
    text(front, t.nameEn, spec.text.nameEn, tc);
    const koSpec = Object.assign({}, spec.text.nameKo, {
      x: spec.text.nameEn.x + advance(t.nameEn, spec.text.nameEn) / MM + spec.text.nameKo.gapAfterEn,
      y: spec.text.nameKo.y != null ? spec.text.nameKo.y : spec.text.nameEn.y
    });
    text(front, t.nameKo, koSpec, tc);
    ['title1', 'title2', 'email1', 'email2', 'mobile'].forEach((k) => text(front, t[k], spec.text[k], tc));
    spec.fixed.forEach((f) => text(front, f.text, f, tc));
    cropMarks(front);

    // ── 뒷면
    const back = newPage();
    logo(back, layout.back.logo);
    cropMarks(back);

    return { bytes: await doc.save(), variant: v.key };
  }

    function txt(s, spec, color) {
      if (!s) return '';
      return '<div class="t" style="left:' + (spec.x * PX).toFixed(2) + 'px;top:' + (spec.y * PX - spec.size * PT * ASC).toFixed(2) + 'px;font-size:' + (spec.size * PT).toFixed(2) +
        'px;font-weight:' + W8[spec.font] + ';letter-spacing:' + ((spec.tracking || 0) / 1000) + 'em;color:' + color + '">' + esc(s) + '</div>';
    }
    if (S.face === 'back') {
      return '<div style="position:absolute;inset:0;background:#fff"></div>' + path(LAYOUT.back.logo);
    }
    var v = HSMCCard.pickVariant(LAYOUT, p).spec;
    var color = hexOf[v.textColor];
    h += '<div style="position:absolute;inset:0;background:' + (v.background ? hexOf[v.background] : '#fff') + '"></div>';
    v.rules.forEach(function (r) {
      var c = hexOf[r.color], w = Math.max(r.strokePt * PT * 1.2, 0.6);
      if (r.x1 === r.x2) h += '<div style="position:absolute;left:' + (r.x1 * PX - w / 2) + 'px;top:' + (Math.max(r.y1, 0) * PX) + 'px;width:' + w + 'px;height:' + ((Math.min(r.y2, 50) - Math.max(r.y1, 0)) * PX) + 'px;background:' + c + '"></div>';
      else h += '<div style="position:absolute;left:' + (r.x1 * PX) + 'px;top:' + (r.y1 * PX - w / 2) + 'px;width:' + ((Math.min(r.x2, 90) - r.x1) * PX) + 'px;height:' + w + 'px;background:' + c + '"></div>';
    });
    h += path(v.logo);
    var ne = v.text.nameEn, nk = v.text.nameKo;
    h += '<div class="t" style="left:' + (ne.x * PX) + 'px;top:' + ((nk.y != null ? nk.y : ne.y) * PX - 9 * PT * ASC).toFixed(2) + 'px;display:flex;gap:' + (nk.gapAfterEn * PX) + 'px;font-size:' + (9 * PT).toFixed(2) + 'px;font-weight:800;color:' + color + '">' +
      '<span style="letter-spacing:' + (ne.tracking / 1000) + 'em">' + esc(t.nameEn) + '</span><span style="letter-spacing:' + (nk.tracking / 1000) + 'em">' + esc(t.nameKo) + '</span></div>';
    ['title1', 'title2', 'email1', 'email2', 'mobile'].forEach(function (k) { h += txt(t[k], v.text[k], color); });
    v.fixed.forEach(function (f) { h += txt(f.text, f, color); });
    return h;
  }

  function onCardMove(e) {
    var box = document.getElementById('cardbox'), card = document.getElementById('card');
    if (!box || !card) return;
    var r = box.getBoundingClientRect(), W = box.offsetWidth, H = box.offsetHeight;
    var s0 = W / 450, s1 = 2;
    var cx = (e.clientX - r.left) * (W / r.width), cy = (e.clientY - r.top) * (H / r.height);
    var tx = Math.max(W - s1 * 450, Math.min(0, cx - s1 * cx / s0));
    var ty = Math.max(H - s1 * 250, Math.min(0, cy - s1 * cy / s0));
    card.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s1 + ')';
  }
  function onCardLeave() {
    var box = document.getElementById('cardbox'), card = document.getElementById('card');
    if (box && card) card.style.transform = 'scale(' + (box.offsetWidth / 450) + ')';
  }

  // ── 이벤트
  panel.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var act = b.getAttribute('data-act'), v = b.getAttribute('data-v');
    if (act === 'skip') go(firstScreen());
    else if (act === 'login') doLogin();
    else if (act === 'reason') { if (v !== S.reason) { S = Object.assign(blank(), { screen: 'reason', reason: v }); } render(); }
    else if (act === 'next') step(1);
    else if (act === 'prev') step(-1);
    else if (act === 'org') {
      var opts = titleOptionsFor(v);
      var keep = S.title_ko && (opts.indexOf(S.title_ko) >= 0 || (S.emp && S.emp.title === S.title_ko));
      S.orgKey = v; if (!keep) S.title_ko = '';
      render();
    }
    else if (act === 'openSheet') { S.sheet = true; render(); }
    else if (act === 'closeSheet') { S.sheet = false; render(); }
    else if (act === 'title') { S.title_ko = v; S.sheet = false; render(); }
    else if (act === 'pick') pickEmployee(Number(v));
    else if (act === 'toNewHire') { S = Object.assign(blank(), { screen: 'org', reason: 'new_hire' }); render(); }
    else if (act === 'face') { S.face = v; render(); }
    else if (act === 'edit') {
      if (S.reason === 'reorder') { S.reason = 'info_change'; go('contact'); }
      else if (S.reason === 'info_change') go('contact');
      else go('org');
    }
    else if (act === 'submit') submit();
    else if (act === 'restart') { S = Object.assign(blank(), { screen: 'intro' }); go('intro'); }
  });

  panel.addEventListener('input', function (e) {
    var f = e.target.getAttribute('data-f');
    if (!f) return;
    var v = e.target.value;
    if (f === 'login_id' || f === 'login_pw') { LOGIN[f === 'login_id' ? 'id' : 'pw'] = v; refresh(); return; }
    if (f === 'mobile') { v = v.replace(/\D/g, '').slice(0, 11); e.target.value = v; }
    if (f === 'email1' || f === 'email2') { v = cleanId(v); e.target.value = v; }
    S[f] = v;
    if (f === 'email1' && !S.email2Touched) { S.email2 = v; var e2 = document.getElementById('email2'); if (e2) e2.value = v; }
    if (f === 'email2') S.email2Touched = true;
    if (f === 'query') { S.emp = null; document.getElementById('cands').innerHTML = candsHTML(); }
    refresh();
  });

  panel.addEventListener('mousemove', function (e) { if (e.target.closest('#cardbox')) onCardMove(e); });
  panel.addEventListener('mouseout', function (e) { if (e.target.closest && e.target.closest('#cardbox') && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('#cardbox'))) onCardLeave(); });

  function pickEmployee(id) {
    var base = DATA.employees.filter(function (x) { return x.id === id; })[0];
    if (!base) return;
    S.emp = Object.assign({}, base); S.empLoading = true;
    document.getElementById('cands').innerHTML = candsHTML(); refresh();
    call('getEmployee', id).then(function (e) {
      if (!S.emp || S.emp.id !== id) return;
      S.emp = e; S.empLoading = false;
      S.orgKey = (e.org === '2본부' && !e.team) ? '' : orgKeyOf(e.org, e.team);
      S.ko_last = e.koLast; S.ko_first = e.koFirst; S.title_ko = e.title;
      var parts = String(e.enName || '').split(' ');
      S.en_last = parts.length > 1 ? parts[parts.length - 1] : ''; S.en_first = parts.slice(0, -1).join(' ');
      S.title_en = e.enTitle1 || '';
      S.mobile = e.mobile; S.email1 = e.email1; S.email2 = e.email2; S.email2Touched = e.email1 !== e.email2;
      if (S.screen === 'find-me') { document.getElementById('cands').innerHTML = candsHTML(); refresh(); }
    }).catch(function (err) {
      S.emp = null; S.empLoading = false;
      S.error = '직원 정보를 불러오지 못했어요. 다시 선택해 주세요.';
      render();
    });
  }
  // 2본부 직원은 시트에 팀이 비어 있으면 소속을 화면에서 다시 고르게 됨.
  // 단, 명함 소진·정보 변경은 소속 화면을 거치지 않으므로 기존 소속(2본부) 그대로 사용
  function ensureOrgKey() { if (!S.orgKey && S.emp) S.orgKey = orgKeyOf(S.emp.org, S.emp.team); }

  // ── PDF 재료 (글꼴·라이브러리) 미리 받아두기
  var assetsPromise = null;
  function importFontkit(i) {
    i = i || 0;
    if (i >= FONTKIT_URLS.length) return Promise.reject(new Error('fontkit'));
    return import(FONTKIT_URLS[i]).catch(function () { return importFontkit(i + 1); });
  }
  function loadAssets() {
    if (!assetsPromise) {
      var files = LAYOUT.fonts.files, keys = Object.keys(files), fontBytes = {};
      assetsPromise = Promise.all([importFontkit()].concat(keys.map(function (k) {
        return fetch(FONT_BASE + files[k]).then(function (r) { if (!r.ok) throw new Error('font ' + k); return r.arrayBuffer(); })
          .then(function (b) { fontBytes[k] = new Uint8Array(b); });
      }))).then(function (res) { var m = res[0]; return { fontkit: m.default || m, fontBytes: fontBytes }; });
      assetsPromise.catch(function () { assetsPromise = null; });
    }
    return assetsPromise;
  }
  function toBase64(bytes) {
    var s = '', CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(s);
  }

  function submit() {
    if (S.submitting) return;
    ensureOrgKey();
    S.submitting = true; S.error = ''; render();
    var p = person();
    loadAssets().then(function (a) {
      if (!window.PDFLib) throw new Error('pdf-lib');
      return HSMCCard.buildCardPdf({ PDFLib: window.PDFLib, fontkit: a.fontkit, layout: LAYOUT, fontBytes: a.fontBytes, person: p });
    }).then(function (r) {
      var payload = Object.assign({}, p, { reason: S.reason, employeeId: S.emp ? S.emp.id : null, prevTitle: S.emp ? S.emp.title : '' });
      return call('submitRequest', payload, toBase64(r.bytes));
    }).then(function () {
      S.submitting = false; go('done');
    }).catch(function (err) {
      S.submitting = false;
      var msg = err && err.message ? String(err.message) : '';
      S.error = '신청을 완료하지 못했어요. 입력한 내용은 그대로 있으니 다시 눌러 주세요.' + (msg && msg.length < 80 ? ' (' + msg + ')' : '');
      render();
    });
  }

  // ── 로그인 (서버에서 아이디·비밀번호 확인 후 직원 목록을 받아 옴)
  function applyInit(d) { DATA.employees = d.employees; DATA.enTitles = d.enTitles; DATA.loaded = true; DATA.loadError = ''; }
  function doLogin() {
    if (LOGIN.busy || !canNext()) return;
    var cred = { id: LOGIN.id.trim(), pw: LOGIN.pw };
    LOGIN.busy = true; S.error = ''; render();
    api('login', cred).then(function (d) {
      AUTH = cred; LOGIN.busy = false; applyInit(d);
      try { sessionStorage.setItem('hsmc_auth', JSON.stringify(cred)); } catch (e) {}
      go('reason');
    }).catch(function (err) {
      LOGIN.busy = false; LOGIN.pw = '';
      var m = (err && err.message) || '';
      S.error = (m.indexOf('아이디') >= 0 || m.indexOf('잠겼') >= 0) ? m : '연결이 원활하지 않아요. 잠시 후 다시 시도해 주세요.';
      render();
      var pw = document.getElementById('login_pw'); if (pw) pw.focus();
    });
  }
  panel.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && S.screen === 'login' && e.target.closest && e.target.closest('input')) { e.preventDefault(); doLogin(); }
  });

  // ── 시작: 같은 탭에서 이미 로그인했으면 조용히 다시 확인
  (function () {
    var saved = null;
    try { saved = JSON.parse(sessionStorage.getItem('hsmc_auth') || 'null'); } catch (e) {}
    if (!saved) return;
    api('login', saved).then(function (d) {
      AUTH = saved; applyInit(d);
      if (S.screen === 'login') go('reason');
    }).catch(function () {
      try { sessionStorage.removeItem('hsmc_auth'); } catch (e) {}
    });
  })();
  render();
  startIntro();
  setTimeout(function () { loadAssets().catch(function () {}); }, 4000);
})();
</script>
